[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrooracle"
version = "0.1.0"
description = "AstroOracle: active learning oracle for astronomical anomaly triage (SkyView cutouts + annotations + retrain hooks)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="AstroOracle Contributors"}]
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "astropy>=5.3",
  "astroquery>=0.4.6",
  "scikit-learn>=1.3",
  "pyarrow>=12.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
notebook = [
  "ipywidgets>=8.1",
  "jupyterlab>=4.0",
  "plotly>=5.18",
]
plotly = ["plotly>=5.18"]
watch = ["watchdog>=3.0"]
dev = [
  "pytest>=7.4",
  "ruff>=0.3",
  "black>=24.1",
]

[project.scripts]
astrooracle = "astrooracle.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
