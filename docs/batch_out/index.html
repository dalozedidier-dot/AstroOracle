<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AstroOracle . Batch Annotator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #0b1020; color: #e9edf5; }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }
    .muted { color: rgba(233,237,245,0.72); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .cutout { width: 100%; height: auto; border-radius: 10px; border: 1px solid rgba(255,255,255,0.10); }
    .row-sep { border-top: 1px solid rgba(255,255,255,0.08); }
    a { color: #a7c7ff; }
  </style>
</head>
<body>

<div class="container py-4">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-2">
    <div>
      <h1 class="h5 mb-1">Batch annotator</h1>
      <div class="muted">Offline annotator for a ranked batch. Reads <span class="mono">candidates.json</span> and <span class="mono">cutouts/</span>.</div>
      <div class="muted" style="font-size:0.9rem;">Shortcuts: r real, a artefact, c known, j new_type, u unsure, s skip.</div>
    </div>
    <div class="d-flex gap-2 flex-wrap">
      <button class="btn btn-sm btn-outline-light" id="exportJson">Export JSON</button>
      <button class="btn btn-sm btn-outline-light" id="exportCsv">Export CSV</button>
      <button class="btn btn-sm btn-outline-light" id="clear">Clear</button>
    </div>
  </div>

  <div class="card p-3 mt-3">
    <div class="row g-3 align-items-center">
      <div class="col-md-6">
        <label class="form-label">Score threshold</label>
        <input type="range" class="form-range" id="scoreRange" min="0" max="1" step="0.01" value="0" />
        <div class="muted" style="font-size:0.9rem;">Showing scores >= <span class="mono" id="scoreVal">0.00</span></div>
      </div>
      <div class="col-md-6">
        <label class="form-label">Search id</label>
        <input class="form-control form-control-sm" id="search" placeholder="type an id" />
      </div>
    </div>
  </div>

  <div id="list" class="mt-3"></div>
</div>

<script>
const LABELS = {
  r: 'real_anomaly',
  a: 'artefact',
  c: 'known',
  j: 'new_type',
  u: 'unsure',
};

let CANDIDATES = [];
let ACTIVE_ID = null;

function keyFor(id){ return 'astrooracle_label_' + id; }

function getStored(id){
  const raw = localStorage.getItem(keyFor(id));
  if(!raw) return null;
  try { return JSON.parse(raw); } catch { return null; }
}

function setStored(id, obj){
  localStorage.setItem(keyFor(id), JSON.stringify(obj));
}

function clearAll(){
  for(const c of CANDIDATES){ localStorage.removeItem(keyFor(c.id)); }
  render();
}

function currentThreshold(){
  return parseFloat(document.getElementById('scoreRange').value || '0');
}

function currentSearch(){
  return (document.getElementById('search').value || '').trim().toLowerCase();
}

function filtered(){
  const thr = currentThreshold();
  const q = currentSearch();
  return CANDIDATES.filter(c => {
    if(Number(c.score) < thr) return false;
    if(q && !String(c.id).toLowerCase().includes(q)) return false;
    return true;
  });
}

function render(){
  const list = document.getElementById('list');
  const items = filtered();
  list.innerHTML = '';

  if(items.length === 0){
    list.innerHTML = '<div class="muted">No candidates match filters.</div>';
    return;
  }

  for(const c of items){
    const stored = getStored(c.id);
    const label = stored ? stored.label : '';
    const comment = stored ? (stored.comment || '') : '';

    const card = document.createElement('div');
    card.className = 'card p-3 mb-3';
    card.setAttribute('data-id', c.id);

    const surveys = (c.surveys || []).map(s => {
      const slug = String(s).replace(/[^a-zA-Z0-9_-]+/g, '_');
      const idslug = String(c.id).replace(/[^a-zA-Z0-9_-]+/g, '_');
      return {survey: s, path: `cutouts/${idslug}_${slug}.png`};
    });

    let imgs = '';
    for(const s of surveys){
      imgs += `
        <div class="col-6">
          <div class="muted" style="font-size:0.85rem;">${s.survey}</div>
          <img class="cutout" src="${s.path}" alt="${s.survey}" />
        </div>
      `;
    }

    card.innerHTML = `
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <div class="mono">${c.id}</div>
          <div class="muted" style="font-size:0.9rem;">RA ${Number(c.ra).toFixed(5)} . Dec ${Number(c.dec).toFixed(5)} . score ${Number(c.score).toFixed(4)}</div>
        </div>
        <div class="text-end">
          <div class="muted" style="font-size:0.85rem;">label</div>
          <div class="mono">${label || '(none)'}</div>
        </div>
      </div>

      <div class="row g-2 mt-2">${imgs}</div>

      <div class="row g-2 mt-2 align-items-end">
        <div class="col-md-4">
          <label class="form-label">Set label</label>
          <select class="form-select form-select-sm labelSelect">
            <option value="">(none)</option>
            <option value="real_anomaly" ${label==='real_anomaly'?'selected':''}>real_anomaly (r)</option>
            <option value="artefact" ${label==='artefact'?'selected':''}>artefact (a)</option>
            <option value="known" ${label==='known'?'selected':''}>known (c)</option>
            <option value="new_type" ${label==='new_type'?'selected':''}>new_type (j)</option>
            <option value="unsure" ${label==='unsure'?'selected':''}>unsure (u)</option>
          </select>
        </div>
        <div class="col-md-8">
          <label class="form-label">Comment</label>
          <input class="form-control form-control-sm commentInput" value="${comment.replaceAll('"','&quot;')}" placeholder="optional" />
        </div>
      </div>
    `;

    // events
    const select = card.querySelector('.labelSelect');
    const input = card.querySelector('.commentInput');

    select.addEventListener('change', () => {
      ACTIVE_ID = c.id;
      const rec = getStored(c.id) || {id: c.id, ra: c.ra, dec: c.dec, anomaly_score: c.score};
      rec.label = select.value || null;
      rec.comment = input.value || '';
      rec.annotated_at = new Date().toISOString();
      setStored(c.id, rec);
      render();
    });

    input.addEventListener('change', () => {
      ACTIVE_ID = c.id;
      const rec = getStored(c.id) || {id: c.id, ra: c.ra, dec: c.dec, anomaly_score: c.score};
      rec.label = select.value || null;
      rec.comment = input.value || '';
      rec.annotated_at = new Date().toISOString();
      setStored(c.id, rec);
    });

    card.addEventListener('click', () => { ACTIVE_ID = c.id; });

    list.appendChild(card);
  }
}

function exportRows(){
  const rows = [];
  for(const c of CANDIDATES){
    const rec = getStored(c.id);
    if(rec && rec.label){ rows.push(rec); }
  }
  return rows;
}

function download(filename, text, mime){
  const blob = new Blob([text], {type: mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function exportJson(){
  const rows = exportRows();
  download('annotations.json', JSON.stringify(rows, null, 2), 'application/json');
}

function exportCsv(){
  const rows = exportRows();
  const cols = ['id','ra','dec','anomaly_score','label','comment','annotated_at'];
  const lines = [cols.join(',')];
  for(const r of rows){
    const vals = cols.map(c => {
      const v = (r[c] === undefined || r[c] === null) ? '' : String(r[c]);
      return '"' + v.replaceAll('"','""') + '"';
    });
    lines.push(vals.join(','));
  }
  download('annotations.csv', lines.join('\n'), 'text/csv');
}

async function load(){
  const r = await fetch('candidates.json');
  CANDIDATES = await r.json();
  render();
}

// shortcuts
window.addEventListener('keydown', (ev) => {
  const k = (ev.key || '').toLowerCase();
  if(!ACTIVE_ID) return;
  if(k === 's') return;
  if(!(k in LABELS)) return;

  const rec = getStored(ACTIVE_ID);
  if(!rec) return;
  rec.label = LABELS[k];
  rec.annotated_at = new Date().toISOString();
  setStored(ACTIVE_ID, rec);
  render();
});

// ui events
document.getElementById('scoreRange').addEventListener('input', (ev) => {
  document.getElementById('scoreVal').textContent = Number(ev.target.value).toFixed(2);
  render();
});
document.getElementById('search').addEventListener('input', render);
document.getElementById('exportJson').addEventListener('click', exportJson);
document.getElementById('exportCsv').addEventListener('click', exportCsv);
document.getElementById('clear').addEventListener('click', clearAll);

document.getElementById('scoreVal').textContent = Number(document.getElementById('scoreRange').value).toFixed(2);

load();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
