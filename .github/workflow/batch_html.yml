name: batch-html
on:
  workflow_dispatch:
    inputs:
      n_query:
        description: "Nombre de candidats"
        required: false
        default: "60"
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[plotly]"

      - name: Generate batch HTML
        env:
          NQ: ${{ inputs.n_query || '60' }}
        run: |
          if [ ! -f candidates.parquet ]; then
            echo "candidates.parquet introuvable"
            exit 1
          fi
          astrooracle batch-html --candidates candidates.parquet --out-dir batch_out --n-query "$NQ"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astrooracle_batch_out
          path: batch_out
