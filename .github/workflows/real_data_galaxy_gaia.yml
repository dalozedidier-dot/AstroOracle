name: Real data galaxy candidates (Gaia coords)

on:
  workflow_dispatch:

jobs:
  real_galaxy_gaia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,plotly,graph,astro]"

      - name: Build candidates.parquet (real coords via Gaia DR3)
        run: |
          python tools/real_data/build_candidates_from_ecsv.py             --input test_data/real/galaxy_candidates_sample.csv.gz             --out candidates.parquet             --kind galaxy_candidates             --mode gaia             --limit 2000             --gaia-max-rows 2000

      - name: Generate batch HTML report (offline cutouts)
        run: |
          mkdir -p _ci_out/real_galaxy_gaia
          astrooracle batch-html --out-dir _ci_out/real_galaxy_gaia --offline --candidates candidates.parquet

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: real_galaxy_gaia_report
          path: _ci_out/real_galaxy_gaia
