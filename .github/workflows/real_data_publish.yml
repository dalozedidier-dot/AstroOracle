name: Real data publish (offline to Pages)

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Rows sampled from real ECSV"
        required: true
        default: "500"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,api,plotly,graph]"
      - name: Build candidates.parquet (pseudo RA/Dec)
        run: |
          mkdir -p _ci_out/real_publish
          python tools/real_data/build_candidates_from_ecsv.py             --input test_data/real/galaxy_candidates_sample.csv.gz             --output _ci_out/real_publish/candidates.parquet             --mode pseudo             --n "${{ inputs.n }}"
      - name: Generate batch HTML report into docs/
        run: |
          mkdir -p docs/real_demo
          astrooracle batch-html --candidates _ci_out/real_publish/candidates.parquet --out-dir docs/real_demo --offline
      - name: Commit and push docs update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/real_demo || true
          git commit -m "chore: update real_demo report" || exit 0
          git push
