name: Real data galaxy candidates (offline)

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

jobs:
  real_galaxy_offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,plotly,graph]"

      - name: Build candidates.parquet (from real ECSV, offline coords)
        run: |
          python tools/real_data/build_candidates_from_ecsv.py             --input test_data/real/galaxy_candidates_sample.csv.gz             --out candidates.parquet             --kind galaxy_candidates             --mode pseudo             --limit 20000

      - name: Generate batch HTML report (offline cutouts)
        run: |
          mkdir -p _ci_out/real_galaxy_offline
          astrooracle batch-html --out-dir _ci_out/real_galaxy_offline --offline --candidates candidates.parquet

      - name: Upload report artifact
        uses: actions/upload-artifact@v6
        with:
          name: real_galaxy_offline_report
          path: _ci_out/real_galaxy_offline
