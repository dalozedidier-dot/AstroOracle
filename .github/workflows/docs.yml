name: Docs (Sphinx)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "doc/**"
      - "src/**"
      - "pyproject.toml"
      - "requirements*.txt"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install sphinx furo

      - name: Build Sphinx HTML
        run: |
          set -e
          if [ -f "docs/conf.py" ]; then
            sphinx-build -b html docs docs/_build/html
          elif [ -f "doc/conf.py" ]; then
            sphinx-build -b html doc doc/_build/html
          else
            echo "No Sphinx conf.py found under docs/ or doc/. Skipping."
            mkdir -p _ci_out/docs
            echo "No docs built." > _ci_out/docs/README.txt
            exit 0
          fi

      - name: Collect
        run: |
          mkdir -p _ci_out/docs
          if [ -d "docs/_build/html" ]; then
            cp -R docs/_build/html _ci_out/docs/html
          fi
          if [ -d "doc/_build/html" ]; then
            cp -R doc/_build/html _ci_out/docs/html
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: docs-html
          path: _ci_out/docs
          if-no-files-found: error
