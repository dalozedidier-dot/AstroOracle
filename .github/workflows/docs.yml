name: Docs

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[docs]"

      - name: Build Sphinx
        run: |
          sphinx-build -b html docs docs/_build/html

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: docs-html
          path: docs/_build/html
