name: Real data smoke (offline)

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Rows sampled from real ECSV"
        required: true
        default: "500"
  schedule:
    - cron: "41 2 * * 0"

jobs:
  real-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,api,plotly,graph]"
      - name: Build candidates.parquet from real sample (pseudo RA/Dec)
        run: |
          mkdir -p _ci_out/real_offline
          python tools/real_data/build_candidates_from_ecsv.py             --input test_data/real/galaxy_candidates_sample.csv.gz             --output _ci_out/real_offline/candidates.parquet             --mode pseudo             --n "${{ inputs.n }}"
      - name: Generate batch HTML report
        run: |
          astrooracle batch-html --candidates _ci_out/real_offline/candidates.parquet --out-dir _ci_out/real_offline/batch --offline
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: real-data-offline
          path: _ci_out/real_offline
