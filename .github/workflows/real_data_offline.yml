name: Real data smoke (offline coords)

on:
  workflow_dispatch:
    inputs:
      n_rows:
        description: "Nombre de lignes a utiliser depuis le sample"
        required: false
        default: "2000"
      n_query:
        description: "Nombre de candidats a inclure dans le batch"
        required: false
        default: "40"
  schedule:
    - cron: "0 4 * * 1"  # Mondays 04:00 UTC

permissions:
  contents: read

jobs:
  real-data-offline:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      ASTROORACLE_OFFLINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,plotly,astro]"

      - name: Build candidates.parquet from real sample (offline coords)
        run: |
          python tools/real_data/build_candidates_from_ecsv.py             --input test_data/real/vari_summary_sample.csv.gz             --output candidates_real.parquet             --coords pseudo             --max-rows "${{ inputs.n_rows }}"             --meta-json real_build_meta.json
          ls -la candidates_real.parquet real_build_meta.json

      - name: Generate batch HTML from real sample
        run: |
          rm -rf _ci_out/real_offline
          mkdir -p _ci_out/real_offline
          astrooracle batch-html --candidates candidates_real.parquet --out-dir _ci_out/real_offline/batch_out --n-query "${{ inputs.n_query }}" --offline
          astrooracle viz3d --input candidates_real.parquet --output _ci_out/real_offline/batch_out/viz3d_globe.html --mode globe --max-points 5000 --cdn
          cp -v real_build_meta.json _ci_out/real_offline/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: real_data_offline_report
          path: _ci_out/real_offline
