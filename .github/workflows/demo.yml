name: demo-visuals

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      ASTROORACLE_OFFLINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,plotly]"

      - name: Generate sample candidates
        run: |
          python examples/sample_candidates.py

      - name: Generate demo visuals (HTML + PNG)
        run: |
          rm -rf demo_out
          astrooracle batch-html --candidates candidates.parquet --out-dir demo_out --n-query 12 --offline

      - name: Generate demo viz3d (Plotly)
        run: |
          astrooracle viz3d --input candidates.parquet --output demo_out/viz3d_globe.html --mode globe --max-points 5000 --cdn

      - name: Upload demo artifacts
        uses: actions/upload-artifact@v6
        with:
          name: demo_out
          path: demo_out
