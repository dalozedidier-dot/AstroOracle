name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      # Black formats sources; this prevents CI from failing on formatting drift
      # while keeping formatting consistent for subsequent steps.
      - name: Format (Black)
        run: |
          black .

      - name: Lint (Ruff)
        run: |
          ruff check .

      - name: Tests
        run: |
          pytest -q
