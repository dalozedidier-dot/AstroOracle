name: AstroOracle Batch HTML (commit)

on:
  workflow_dispatch:
    inputs:
      offline:
        description: "Offline mode (no SkyView fetch)"
        required: true
        default: "true"
  schedule:
    - cron: "17 3 * * 1"

jobs:
  batch-html:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,api,plotly,graph]"

      - name: Generate offline batch report
        run: |
          mkdir -p batch_out_v11_offline
          astrooracle batch-html --out-dir batch_out_v11_offline --offline

      - name: Commit updated batch report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add batch_out_v11_offline index.html || true
          git commit -m "chore: refresh batch HTML report" || exit 0
          git push
