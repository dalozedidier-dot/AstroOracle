name: AstroOracle Batch HTML (commit)

on:
  workflow_dispatch:
    inputs:
      n_query:
        description: "Nombre de candidats a inclure dans le batch"
        required: false
        default: "60"
      branch:
        description: "Branche de publication du batch"
        required: false
        default: "batch-out"
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[plotly,astro]"

      - name: Ensure candidates.parquet exists
        run: |
          if [ ! -f candidates.parquet ]; then
            echo "candidates.parquet absent, generation de test via examples/sample_candidates.py"
            python examples/sample_candidates.py
          else
            echo "candidates.parquet present, utilisation du fichier existant"
          fi
          ls -la candidates.parquet

      - name: Generate batch HTML
        run: |
          astrooracle batch-html             --candidates candidates.parquet             --out-dir batch_out             --n-query "${{ inputs.n_query }}"

      - name: Generate Plotly 3D (globe)
        run: |
          astrooracle viz3d             --input candidates.parquet             --output batch_out/viz3d_globe.html             --mode globe             --max-points 5000             --cdn

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astrooracle_batch_out
          path: batch_out

      - name: Commit batch to branch
        run: |
          BRANCH="${{ inputs.branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"

          rm -rf docs/batch_out
          mkdir -p docs
          mv batch_out docs/batch_out

          git add docs/batch_out
          git commit -m "batch: update docs/batch_out" || echo "Nothing to commit"
          git push -f origin "$BRANCH"
