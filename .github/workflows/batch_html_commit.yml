name: AstroOracle Batch HTML (commit)

on:
  workflow_dispatch:
    inputs:
      n_query:
        description: "Nombre de candidats"
        required: false
        default: "60"

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[plotly]"

      - name: Generate batch HTML
        run: |
          if [ ! -f candidates.parquet ]; then
            echo "candidates.parquet introuvable à la racine"
            exit 1
          fi
          astrooracle batch-html --candidates candidates.parquet --out-dir batch_out --n-query "${{ inputs.n_query }}"

      - name: Commit to batch-out branch
        run: |
          BRANCH="batch-out"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          rm -rf docs/batch_out
          mkdir -p docs
          mv batch_out docs/batch_out

          git add docs/batch_out
          git commit -m "batch: update batch_out" || echo "Nothing to commit"
          git push -f origin "$BRANCH"
