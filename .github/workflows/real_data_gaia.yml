name: Real data smoke (Gaia coords via astroquery)

on:
  workflow_dispatch:
    inputs:
      n_rows:
        description: "Nombre de lignes a utiliser depuis le sample"
        required: false
        default: "300"
      n_query:
        description: "Nombre de candidats a inclure dans le batch"
        required: false
        default: "30"
      strict_gaia:
        description: "Echec si Gaia coords < 80% (true/false)"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  real-data-gaia:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      # Even with real RA/Dec, keep offline cutouts by default for reliability.
      ASTROORACLE_OFFLINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,plotly,astro]"

      - name: Build candidates.parquet (Gaia coords)
        run: |
          STRICT=""
          if [ "${{ inputs.strict_gaia }}" = "true" ]; then
            STRICT="--strict-gaia"
          fi
          python tools/real_data/build_candidates_from_ecsv.py             --input test_data/real/vari_summary_sample.csv.gz             --output candidates_gaia.parquet             --coords gaia             --max-rows "${{ inputs.n_rows }}"             $STRICT             --meta-json gaia_build_meta.json
          ls -la candidates_gaia.parquet gaia_build_meta.json

      - name: Generate batch HTML (Gaia coords, offline cutouts)
        run: |
          rm -rf _ci_out/real_gaia
          mkdir -p _ci_out/real_gaia
          astrooracle batch-html --candidates candidates_gaia.parquet --out-dir _ci_out/real_gaia/batch_out --n-query "${{ inputs.n_query }}" --offline
          astrooracle viz3d --input candidates_gaia.parquet --output _ci_out/real_gaia/batch_out/viz3d_globe.html --mode globe --max-points 5000 --cdn
          cp -v gaia_build_meta.json _ci_out/real_gaia/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: real_data_gaia_report
          path: _ci_out/real_gaia
