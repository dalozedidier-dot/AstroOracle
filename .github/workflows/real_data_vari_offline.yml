name: Real data vari summary (offline)

on:
  workflow_dispatch:
    inputs:
      n:
        description: Rows to sample
        required: false
        default: "500"
      seed:
        description: Random seed
        required: false
        default: "7"

jobs:
  realdata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" || pip install -e .
          pip install pyarrow

      - name: Build candidates.parquet (pseudo)
        run: |
          python tools/real_data/build_candidates_from_ecsv.py \
            --input test_data/real/vari_summary_sample.csv.gz \
            --output candidates.parquet \
            --mode pseudo \
            --n ${{ inputs.n }} \
            --seed ${{ inputs.seed }}

      - name: Make report HTML
        run: |
          python tools/real_data/make_report.py \
            --candidates candidates.parquet \
            --out-dir _ci_out/realdata_vari_offline \
            --title "AstroOracle real data vari summary (offline)" \
            --tag "vari_offline"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: realdata_vari_offline
          path: _ci_out/realdata_vari_offline
