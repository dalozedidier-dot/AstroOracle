name: Real data vari summary (offline)

on:
  workflow_dispatch:
  schedule:
    - cron: "11 4 * * 3"

jobs:
  real_vari_offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,plotly,graph]"

      - name: Build candidates.parquet (from real ECSV, offline coords)
        run: |
          python tools/real_data/build_candidates_from_ecsv.py             --input test_data/real/vari_summary_sample.csv.gz             --out candidates.parquet             --kind vari_summary             --mode pseudo             --limit 20000

      - name: Generate batch HTML report (offline cutouts)
        run: |
          mkdir -p _ci_out/real_vari_offline
          astrooracle batch-html --out-dir _ci_out/real_vari_offline --offline --candidates candidates.parquet

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: real_vari_offline_report
          path: _ci_out/real_vari_offline
