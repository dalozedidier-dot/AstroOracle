name: Bug report
description: Report a bug
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      value: |
        - OS:
        - Python:
        - AstroOracle version:
    validations:
      required: true
